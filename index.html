<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photoshop-TatiPro - Обработка изображений</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Верхняя панель -->
        <header class="top-bar">
            <div class="top-bar-left">
                <span class="logo">Ps</span>
                <span class="app-title">Photoshop-TatiPro</span>
            </div>
            <div class="top-bar-center">
                <span class="workspace-info">Обработка изображений</span>
            </div>
            <div class="top-bar-right">
                <span class="window-controls">— □ ✕</span>
            </div>
        </header>

        <!-- Панель инструментов -->
        <div class="toolbar">
            <div class="tool-group">
                <input type="file" id="fileInput" accept="image/png,image/jpeg,.gb7" hidden>
                <button id="loadBtn" class="btn btn-dark" title="Открыть изображение (Ctrl+O)">
                    <span class="btn-icon">📂</span>
                    <span class="btn-text">Открыть</span>
                </button>
            </div>
            
            <div class="tool-group">
                <button id="downloadBtn" class="btn btn-dark" disabled title="Сохранить как...">
                    <span class="btn-icon">💾</span>
                    <span class="btn-text">Сохранить</span>
                </button>
                <select id="formatSelect" class="select-dark">
                    <option value="png">PNG</option>
                    <option value="jpg">JPEG</option>
                    <option value="gb7">GB7 (градации серого)</option>
                    <option value="gb7-mask">GB7 (с маской)</option>
                </select>
            </div>

            <div class="tool-separator"></div>

            <div class="tool-group">
                <button id="pipetteBtn" class="btn btn-dark" title="Пипетка (I)">
                    <span class="btn-icon">💉</span>
                    <span class="btn-text">Пипетка</span>
                </button>
            </div>

            <div class="tool-separator"></div>

            <div class="tool-group">
                <button id="fitBtn" class="btn btn-dark" title="Вписать в окно">
                    <span class="btn-icon">🔍</span>
                    <span class="btn-text">По размеру</span>
                </button>
                <button id="actualBtn" class="btn btn-dark" title="Реальный размер">
                    <span class="btn-icon">1:1</span>
                    <span class="btn-text">100%</span>
                </button>
            </div>
        </div>

        <!-- Рабочая область -->
        <main class="workspace">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="imageCanvas"></canvas>
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">🖼️</div>
                    <h3>Нет открытого изображения</h3>
                    <p>Перетащите изображение сюда или нажмите "Открыть"</p>
                    <p class="empty-formats">Поддерживаются: PNG, JPEG, GB7</p>
                </div>
            </div>

                    <!-- Панель каналов -->
            <div class="panel channels-panel" id="channelsPanel">
                <div class="panel-header">
                    <span class="panel-title">Каналы</span>
                    <button class="panel-toggle" id="channelsPanelToggle" title="Свернуть/развернуть">▸</button>
                </div>
                <div class="panel-content" id="channelsPanelContent">
                    <div class="channel-item" data-channel="red">
                        <canvas class="channel-preview" id="previewRed" width="60" height="40"></canvas>
                        <div class="channel-info">
                            <label class="channel-label">
                                <input type="checkbox" class="channel-checkbox" data-channel="red" checked>
                                <span class="channel-color red-dot"></span>
                                Красный
                            </label>
                        </div>
                    </div>
                    <div class="channel-item" data-channel="green">
                        <canvas class="channel-preview" id="previewGreen" width="60" height="40"></canvas>
                        <div class="channel-info">
                            <label class="channel-label">
                                <input type="checkbox" class="channel-checkbox" data-channel="green" checked>
                                <span class="channel-color green-dot"></span>
                                Зелёный
                            </label>
                        </div>
                    </div>
                    <div class="channel-item" data-channel="blue">
                        <canvas class="channel-preview" id="previewBlue" width="60" height="40"></canvas>
                        <div class="channel-info">
                            <label class="channel-label">
                                <input type="checkbox" class="channel-checkbox" data-channel="blue" checked>
                                <span class="channel-color blue-dot"></span>
                                Синий
                            </label>
                        </div>
                    </div>
                    <div class="channel-item" data-channel="alpha">
                        <canvas class="channel-preview" id="previewAlpha" width="60" height="40"></canvas>
                        <div class="channel-info">
                            <label class="channel-label">
                                <input type="checkbox" class="channel-checkbox" data-channel="alpha" checked>
                                <span class="channel-color alpha-dot"></span>
                                Альфа
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Панель информации пипетки -->
            <div class="panel info-panel" id="infoPanel">
                <div class="panel-header">
                    <span class="panel-title">Информация о пикселе</span>
                </div>
                <div class="panel-content">
                    <div class="info-row">
                        <span class="info-label">Координаты:</span>
                        <span class="info-value" id="infoCoords">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">RGB:</span>
                        <span class="info-value" id="infoRGB">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">HEX:</span>
                        <span class="info-value" id="infoHEX">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">CIELAB:</span>
                        <span class="info-value" id="infoLAB">—</span>
                    </div>
                    <div class="color-preview" id="colorPreview"></div>
                </div>
            </div>
        </main>

        <!-- Строка состояния -->
        <footer class="status-bar">
            <div class="status-left">
                <span class="status-item">
                    <span class="status-label">Размер:</span>
                    <span id="statusWidth">—</span> × <span id="statusHeight">—</span> px
                </span>
                <span class="status-separator">|</span>
                <span class="status-item">
                    <span class="status-label">Глубина:</span>
                    <span id="statusDepth">—</span>
                </span>
                <span class="status-separator">|</span>
                <span class="status-item">
                    <span class="status-label">Формат:</span>
                    <span id="statusFormat">—</span>
                </span>
            </div>
            <div class="status-right">
                <span class="status-item" id="zoomLevel">100%</span>
            </div>
        </footer>
    </div>
    
    <script type="module" src="js/app.js"></script>
</body>
</html>
